services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nikosh
      POSTGRES_PASSWORD: nikosh
      POSTGRES_DB: nikosh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikosh -d nikosh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nikosh:nikosh@db:5432/nikosh
      TESSERACT_CMD: ""
    ports:
      - "8000:8000"
    volumes:
      - fastembed_cache:/app/.cache/fastembed
      - ./backend/secrets:/app/secrets
      - ./backend/logs:/app/logs
      - ./backend/storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_ICE_SERVERS: ${VITE_ICE_SERVERS:-}
    ports:
      - "3000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
    name: nikosh_pgdata
  fastembed_cache:
    name: nikosh_fastembed_cache
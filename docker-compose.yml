services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nikosh
      POSTGRES_PASSWORD: nikosh
      POSTGRES_DB: nikosh
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nikosh -d nikosh"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://nikosh:nikosh@db:5432/nikosh
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: nikosh_pgdata
